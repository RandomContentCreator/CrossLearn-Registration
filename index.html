<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CrossLearn Registration</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #eef6ff, #dbeafe);
            color: #1f2937;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: min(760px, calc(100vw - 48px));
            background: #ffffff;
            padding: 40px 50px;
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            color: #243b53;
            margin-bottom: 16px;
        }

        h2 {
            color: #315b7a;
            margin-top: 30px;
            font-size: 1.8rem;
        }

        p {
            font-size: 1.05rem;
            line-height: 1.6;
        }

        a {
            color: #005bb5;
            font-weight: bold;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .demo-note {
            font-style: italic;
            color: #596676;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>CrossLearn Registration Page</h1>
        <p>Welcome to CrossLearn's official registration page!</p>
        <p>Please fill out the form below to register:</p>

        <h3><a href="https://tinyurl.com/CrossLearnRegistrationFormDemo" target="_blank">CrossLearn Registration Form</a></h3>

        <p class="demo-note">Note: This is a demo form. Please do not submit any personal information.</p>

        <h2>Thank You for joining CrossLearn</h2>
    </div>
</body>
</html>
